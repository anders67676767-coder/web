<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健康飲食AI助手</title>
  <style>
    body {
      font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f4f8f5;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }
    .chatbox {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: #2f855a;
      color: white;
      padding: 18px 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }
    .messages {
      padding: 18px;
      height: 420px;
      overflow-y: auto;
      background: #fafafa;
    }
    .msg {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      margin: 10px 0;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .user {
      margin-left: auto;
      background: #d1fae5;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background: #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    .inputbar {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }
    input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #2f855a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #276749;
    }
    .tips {
      padding: 0 18px 18px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="chatbox">
    <div class="header">
      <h1>健康飲食AI助手</h1>
      <p>可回答：健康食物、均衡飲食、健康烹調方法</p>
    </div>

    <div id="messages" class="messages"></div>

    <div class="inputbar">
      <input id="input" type="text" placeholder="例如：什麼是均衡飲食？" />
      <button onclick="sendMessage()">送出</button>
    </div>

    <div class="tips">
      試試問：「什麼是健康食物？」、「怎樣才算均衡飲食？」、「有哪些健康烹調方法？」
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    const knowledge = [
      {
        keys: ["健康食物", "健康的食物", "healthy food", "食物"],
        answer:
          "健康食物通常是營養密度高、加工程度低的食物，例如蔬菜、水果、全穀類、豆類、魚、瘦肉、蛋和低脂奶類。它們能提供身體所需的維他命、礦物質、蛋白質和纖維，並且較少含過多油、鹽和糖。"
      },
      {
        keys: ["均衡飲食", "balanced diet", "平衡飲食"],
        answer:
          "均衡飲食是指各類食物都吃得適量，重點是種類多樣、份量合適。一般原則是以穀物類為主，多吃蔬菜和水果，並適量攝取肉、魚、蛋、奶類及其代替品，同時少吃油、鹽、糖。"
      },
      {
        keys: ["健康烹調", "烹調方法", "煮法", "cook", "cooking"],
        answer:
          "建議的健康烹調方法以少油、少鹽、少糖為原則。較好的方法包括蒸、燉、炆、烚、白焯、焗、少油快炒，以及使用易潔鑊或隔油方法，並盡量減少煎炸。"
      }
    ];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function getAnswer(text) {
      const q = text.trim().toLowerCase();

      for (const item of knowledge) {
        if (item.keys.some(k => q.includes(k.toLowerCase()))) {
          return item.answer;
        }
      }

      return "我主要可以回答健康食物、均衡飲食和健康烹調方法。你可以問：\n- 什麼是健康食物？\n- 什麼是均衡飲食？\n- 建議的健康烹調方法是什麼？";
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      addMessage(getAnswer(text), "bot");
      input.value = "";
      input.focus();
    }

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });

    addMessage("你好，我是健康飲食AI助手。你可以問我健康食物、均衡飲食或健康烹調方法。", "bot");
  </script>
</body>

  <script>
(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="ZGLPa8TaUWwZ3jdaDB4Ap";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
</script>
  
</html>
